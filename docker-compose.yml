# CCTV Monitoring — stack Docker Compose
#
# Dua container dari satu image:
#   mediamtx → engine streaming (RTSP/HLS internal, API di :9123)
#   web      → aplikasi Node (Express + SQLite), publish 4025 → 3003
#
# Hanya web yang punya port publik. RTSP/HLS sengaja tidak dipublish:
# MediaMTX menarik stream dari kamera, dan browser mengambil HLS lewat proxy
# same-origin di aplikasi (/cam_*).
#
# Data persisten (jangan dihapus): volume `cctv-data`
#   /app/data/config.json  /app/data/cameras.db  /app/data/sessions.db
#   /app/data/recordings/

name: cctv-monitoring

services:
  mediamtx:
    build:
      context: .
      dockerfile: Dockerfile
    image: cctv-monitoring:compose
    command: ["mediamtx", "/app/mediamtx.container.yml"]
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      # record_notify.sh memanggil app setelah satu segmen rekaman selesai
      APP_BASE_URL: http://web:3003
      CCTV_DATA_DIR: /app/data
    volumes:
      - cctv-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9123/v3/paths/list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # transcode ffmpeg per kamera; naikkan kalau kamera yang di-transcode > 2
          memory: 1500M

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cctv-monitoring:compose
    command: ["node", "index.js"]
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_healthy
    environment:
      TZ: Asia/Jakarta
      NODE_ENV: production
      CCTV_DATA_DIR: /app/data
      # AI counter (PyTorch) tidak tersedia di image ini
      CCTV_DISABLE_AI: "1"
      MEDIAMTX_HOST: mediamtx
      # secret & URL publik diisi lewat ENV Coolify / .env
      SESSION_SECRET: ${SESSION_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      RECORDING_RETENTION: ${RECORDING_RETENTION:-7d}
      # login admin (opsional, menimpa config.json)
      CCTV_ADMIN_USER: ${CCTV_ADMIN_USER:-}
      CCTV_ADMIN_PASS: ${CCTV_ADMIN_PASS:-}
    ports:
      - "4025:3003"
    volumes:
      - cctv-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3003/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 1200M

volumes:
  cctv-data:
    name: cctv-monitoring-data
